CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_I2C=y
CONFIG_LOG=y
CONFIG_BT_DEVICE_NAME="Central_Detector"


# Core 
# --- Core Networking ---
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_LOG=y

# --- Socket / POSIX API ---
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y             # Enables POSIX names like socket(), connect(), send()
CONFIG_NET_NATIVE=y            # Use Zephyr’s built-in TCP/IP stack

# --- W5500 Ethernet driver ---
CONFIG_SPI=y
CONFIG_ETH_W5500=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_AUTO_INIT=y  # <-- ensures Zephyr brings the interface up automatically
CONFIG_I2C=y
# --- Static IPv4 configuration ---
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.1.170"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.168.1.200"
CONFIG_NET_CONFIG_INIT_TIMEOUT=0

# --- EMBED TLS ---
# --- Core MbedTLS support ---
CONFIG_NRF_SECURITY=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
# CONFIG_MBEDTLS_MD5_C=y
CONFIG_MBEDTLS_AES_C=y
CONFIG_MBEDTLS_LEGACY_CRYPTO_C=y
CONFIG_NORDIC_SECURITY_BACKEND=y
# CONFIG_MBEDTLS_MD5_C=y
# --- Message-Digest (MD5) subsystem ---
# CONFIG_MBEDTLS_MD_C=y
# CONFIG_MBEDTLS_MESSAGE_DIGEST_C=y
# JSON Parser
CONFIG_JSON_LIBRARY=y

# --- Optional logging ---
# --- Do NOT enable legacy cipher layer ---
# CONFIG_MBEDTLS_LEGACY_CRYPTO_C is not set
