CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_I2C=y
CONFIG_LOG=y
CONFIG_BT_DEVICE_NAME="Central_Detector"


# Core 
# --- Core Networking ---
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_LOG=y

# --- Socket / POSIX API ---
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y             # Enables POSIX names like socket(), connect(), send()
CONFIG_NET_NATIVE=y            # Use Zephyr’s built-in TCP/IP stack

# --- W5500 Ethernet driver ---
CONFIG_SPI=y
CONFIG_ETH_W5500=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_AUTO_INIT=y  # <-- ensures Zephyr brings the interface up automatically
CONFIG_I2C=y
# --- Static IPv4 configuration ---
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.1.170"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.168.1.200"
CONFIG_NET_CONFIG_INIT_TIMEOUT=0

# --- Logging ---
